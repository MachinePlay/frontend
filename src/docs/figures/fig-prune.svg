<text class="head" x="24" y="358">STEP BY STEP</text>
<text class="num" x="24" y="382">1.</text>
<text class="cap" x="50" y="382" xml:space="preserve"><tspan>Start</tspan><tspan> at</tspan><tspan class="b"> A</tspan><tspan>.</tspan><tspan> It</tspan><tspan> is</tspan><tspan> your</tspan><tspan> move,</tspan><tspan> so</tspan><tspan> the</tspan><tspan> biggest</tspan><tspan> child</tspan><tspan> wins.</tspan><tspan> Nothing</tspan><tspan> seen</tspan><tspan> yet,</tspan><tspan> so</tspan></text>
<text class="cap" x="50" y="400" xml:space="preserve"><tspan>the</tspan><tspan> score</tspan><tspan> could</tspan><tspan> still</tspan><tspan> be</tspan><tspan> anything.</tspan></text>
<text class="num" x="24" y="426">2.</text>
<text class="cap" x="50" y="426" xml:space="preserve"><tspan>Walk</tspan><tspan> down</tspan><tspan> into</tspan><tspan class="b"> B</tspan><tspan>.</tspan><tspan> It</tspan><tspan> is</tspan><tspan> your</tspan><tspan> opponent's</tspan><tspan> move,</tspan><tspan> so</tspan><tspan> the</tspan><tspan> smallest</tspan><tspan> child</tspan><tspan> wins.</tspan></text>
<text class="cap" x="50" y="444" xml:space="preserve"><tspan>Nothing</tspan><tspan> seen</tspan><tspan> yet,</tspan><tspan> so</tspan><tspan> the</tspan><tspan> score</tspan><tspan> could</tspan><tspan> still</tspan><tspan> be</tspan><tspan> anything.</tspan></text>
<text class="num" x="24" y="470">3.</text>
<text class="cap" x="50" y="470" xml:space="preserve"><tspan>Bottom</tspan><tspan> of</tspan><tspan> the</tspan><tspan> tree.</tspan><tspan> Evaluate</tspan><tspan> the</tspan><tspan> position:</tspan><tspan class="b"> 4</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="496">4.</text>
<text class="cap" x="50" y="496" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> 4</tspan><tspan>.</tspan><tspan class="b"> B</tspan><tspan> takes</tspan><tspan> your</tspan><tspan> opponent's</tspan><tspan> side,</tspan><tspan> so</tspan><tspan> from</tspan><tspan> here</tspan><tspan> its</tspan><tspan> score</tspan><tspan> can</tspan><tspan> only</tspan></text>
<text class="cap" x="50" y="514" xml:space="preserve"><tspan>fall:</tspan><tspan class="b"> ≤</tspan><tspan class="b"> 4</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="540">5.</text>
<text class="cap" x="50" y="540" xml:space="preserve"><tspan>Bottom</tspan><tspan> of</tspan><tspan> the</tspan><tspan> tree.</tspan><tspan> Evaluate</tspan><tspan> the</tspan><tspan> position:</tspan><tspan class="b"> 8</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="566">6.</text>
<text class="cap" x="50" y="566" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> 8</tspan><tspan>.</tspan><tspan> No</tspan><tspan> better</tspan><tspan> for</tspan><tspan> your</tspan><tspan> opponent:</tspan><tspan class="b"> B</tspan><tspan> stays</tspan><tspan class="b"> ≤</tspan><tspan class="b"> 4</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="592">7.</text>
<text class="cap" x="50" y="592" xml:space="preserve"><tspan class="b">B</tspan><tspan> is</tspan><tspan> finished</tspan><tspan> at</tspan><tspan class="b"> 4</tspan><tspan>,</tspan><tspan> and</tspan><tspan> that</tspan><tspan> goes</tspan><tspan> back</tspan><tspan> up</tspan><tspan> to</tspan><tspan class="b"> A</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="618">8.</text>
<text class="cap" x="50" y="618" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> 4</tspan><tspan>.</tspan><tspan class="b"> A</tspan><tspan> takes</tspan><tspan> your</tspan><tspan> side,</tspan><tspan> so</tspan><tspan> from</tspan><tspan> here</tspan><tspan> its</tspan><tspan> score</tspan><tspan> can</tspan><tspan> only</tspan><tspan> climb:</tspan><tspan class="b"> ≥</tspan></text>
<text class="cap" x="50" y="636" xml:space="preserve"><tspan class="b">4</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="662">9.</text>
<text class="cap" x="50" y="662" xml:space="preserve"><tspan>Walk</tspan><tspan> down</tspan><tspan> into</tspan><tspan class="b"> C</tspan><tspan>.</tspan><tspan> It</tspan><tspan> is</tspan><tspan> your</tspan><tspan> opponent's</tspan><tspan> move,</tspan><tspan> so</tspan><tspan> the</tspan><tspan> smallest</tspan><tspan> child</tspan><tspan> wins.</tspan></text>
<text class="cap" x="50" y="680" xml:space="preserve"><tspan>Nothing</tspan><tspan> seen</tspan><tspan> yet,</tspan><tspan> so</tspan><tspan> the</tspan><tspan> score</tspan><tspan> could</tspan><tspan> still</tspan><tspan> be</tspan><tspan> anything.</tspan></text>
<text class="num" x="24" y="706">10.</text>
<text class="cap" x="50" y="706" xml:space="preserve"><tspan>Bottom</tspan><tspan> of</tspan><tspan> the</tspan><tspan> tree.</tspan><tspan> Evaluate</tspan><tspan> the</tspan><tspan> position:</tspan><tspan class="b"> 3</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="732">11.</text>
<text class="cap" x="50" y="732" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> 3</tspan><tspan>.</tspan><tspan class="b"> C</tspan><tspan> takes</tspan><tspan> your</tspan><tspan> opponent's</tspan><tspan> side,</tspan><tspan> so</tspan><tspan> from</tspan><tspan> here</tspan><tspan> its</tspan><tspan> score</tspan><tspan> can</tspan><tspan> only</tspan></text>
<text class="cap" x="50" y="750" xml:space="preserve"><tspan>fall:</tspan><tspan class="b"> ≤</tspan><tspan class="b"> 3</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="776">12.</text>
<text class="cap cut" x="50" y="776" xml:space="preserve"><tspan class="b">A</tspan><tspan> is</tspan><tspan> already</tspan><tspan class="b"> ≥</tspan><tspan class="b"> 4</tspan><tspan> and</tspan><tspan class="b"> C</tspan><tspan> is</tspan><tspan class="b"> ≤</tspan><tspan class="b"> 3</tspan><tspan>,</tspan><tspan> so</tspan><tspan class="b"> C</tspan><tspan> has</tspan><tspan> already</tspan><tspan> lost</tspan><tspan> that</tspan><tspan> comparison.</tspan><tspan> Nothing</tspan></text>
<text class="cap cut" x="50" y="794" xml:space="preserve"><tspan>left</tspan><tspan> underneath</tspan><tspan> it</tspan><tspan> can</tspan><tspan> change</tspan><tspan> the</tspan><tspan> answer.</tspan><tspan class="b"> Skip</tspan><tspan class="b"> it.</tspan></text>
<text class="num" x="24" y="820">13.</text>
<text class="cap" x="50" y="820" xml:space="preserve"><tspan class="b">C</tspan><tspan> is</tspan><tspan> finished</tspan><tspan> at</tspan><tspan class="b"> ≤</tspan><tspan class="b"> 3</tspan><tspan>:</tspan><tspan> we</tspan><tspan> never</tspan><tspan> learned</tspan><tspan> its</tspan><tspan> exact</tspan><tspan> score,</tspan><tspan> only</tspan><tspan> that</tspan><tspan> it</tspan><tspan> is</tspan><tspan> at</tspan></text>
<text class="cap" x="50" y="838" xml:space="preserve"><tspan>most</tspan><tspan class="b"> 3</tspan><tspan>,</tspan><tspan> and</tspan><tspan> that</tspan><tspan> goes</tspan><tspan> back</tspan><tspan> up</tspan><tspan> to</tspan><tspan class="b"> A</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="864">14.</text>
<text class="cap" x="50" y="864" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> 3</tspan><tspan>.</tspan><tspan> No</tspan><tspan> better</tspan><tspan> for</tspan><tspan> you:</tspan><tspan class="b"> A</tspan><tspan> stays</tspan><tspan class="b"> ≥</tspan><tspan class="b"> 4</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="890">15.</text>
<text class="cap" x="50" y="890" xml:space="preserve"><tspan class="b">A</tspan><tspan> is</tspan><tspan> finished</tspan><tspan> at</tspan><tspan class="b"> 4</tspan><tspan>.</tspan><tspan> That</tspan><tspan> is</tspan><tspan> the</tspan><tspan> move</tspan><tspan> to</tspan><tspan> play.</tspan></text>
<text class="num" x="24" y="916">16.</text>
<text class="cap" x="50" y="916" xml:space="preserve"><tspan>Done:</tspan><tspan class="b"> A</tspan><tspan> =</tspan><tspan class="b"> 4</tspan><tspan>,</tspan><tspan> the</tspan><tspan> same</tspan><tspan> answer,</tspan><tspan> after</tspan><tspan> evaluating</tspan><tspan class="b"> 3</tspan><tspan> leaves</tspan><tspan> instead</tspan><tspan> of</tspan><tspan> 4.</tspan><tspan> The</tspan><tspan class="b"> 1</tspan></text>
<text class="cap" x="50" y="934" xml:space="preserve"><tspan>skipped</tspan><tspan> leaf</tspan><tspan> could</tspan><tspan> not</tspan><tspan> have</tspan><tspan> changed</tspan><tspan> it.</tspan></text>
