<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 1070" width="592" height="1070" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
  .bg    { fill: #ffffff; }
  .panel { fill: #f6f7f9; }
  .done  { fill: #ebedf0; }
  .line  { stroke: #c8cdd4; }
