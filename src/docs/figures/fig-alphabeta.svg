<text class="head" x="24" y="398">STEP BY STEP</text>
<text class="num" x="24" y="422">1.</text>
<text class="cap" x="50" y="422" xml:space="preserve"><tspan>Start</tspan><tspan> at</tspan><tspan class="b"> A</tspan><tspan>.</tspan><tspan> It</tspan><tspan> is</tspan><tspan> your</tspan><tspan> move,</tspan><tspan> and</tspan><tspan> the</tspan><tspan> score</tspan><tspan> belongs</tspan><tspan> to</tspan><tspan> whoever</tspan><tspan> moves,</tspan><tspan> so</tspan><tspan class="b"> A</tspan></text>
<text class="cap" x="50" y="440" xml:space="preserve"><tspan>takes</tspan><tspan> the</tspan><tspan> biggest</tspan><tspan> child</tspan><tspan> like</tspan><tspan> every</tspan><tspan> other</tspan><tspan> node.</tspan><tspan> Nothing</tspan><tspan> seen</tspan><tspan> yet.</tspan></text>
<text class="num" x="24" y="466">2.</text>
<text class="cap" x="50" y="466" xml:space="preserve"><tspan>Walk</tspan><tspan> down</tspan><tspan> into</tspan><tspan class="b"> B</tspan><tspan>.</tspan><tspan> It</tspan><tspan> is</tspan><tspan> your</tspan><tspan> opponent's</tspan><tspan> move,</tspan><tspan> and</tspan><tspan> the</tspan><tspan> score</tspan><tspan> belongs</tspan><tspan> to</tspan></text>
<text class="cap" x="50" y="484" xml:space="preserve"><tspan>whoever</tspan><tspan> moves,</tspan><tspan> so</tspan><tspan class="b"> B</tspan><tspan> takes</tspan><tspan> the</tspan><tspan> biggest</tspan><tspan> child</tspan><tspan> like</tspan><tspan> every</tspan><tspan> other</tspan><tspan> node.</tspan><tspan> Nothing</tspan></text>
<text class="cap" x="50" y="502" xml:space="preserve"><tspan>seen</tspan><tspan> yet.</tspan></text>
<text class="num" x="24" y="528">3.</text>
<text class="cap" x="50" y="528" xml:space="preserve"><tspan>Bottom</tspan><tspan> of</tspan><tspan> the</tspan><tspan> tree.</tspan><tspan> Evaluate</tspan><tspan> the</tspan><tspan> position</tspan><tspan> for</tspan><tspan> the</tspan><tspan> side</tspan><tspan> to</tspan><tspan> move:</tspan><tspan class="b"> 4</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="554">4.</text>
<text class="cap" x="50" y="554" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> 4</tspan><tspan>,</tspan><tspan> which</tspan><tspan> is</tspan><tspan class="b"> -4</tspan><tspan> from</tspan><tspan> here.</tspan><tspan class="b"> B</tspan><tspan> takes</tspan><tspan> your</tspan><tspan> opponent's</tspan><tspan> side,</tspan><tspan> so</tspan><tspan> from</tspan></text>
<text class="cap" x="50" y="572" xml:space="preserve"><tspan>here</tspan><tspan> its</tspan><tspan> score</tspan><tspan> can</tspan><tspan> only</tspan><tspan> climb:</tspan><tspan class="b"> ≥</tspan><tspan class="b"> -4</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="598">5.</text>
<text class="cap" x="50" y="598" xml:space="preserve"><tspan>Bottom</tspan><tspan> of</tspan><tspan> the</tspan><tspan> tree.</tspan><tspan> Evaluate</tspan><tspan> the</tspan><tspan> position</tspan><tspan> for</tspan><tspan> the</tspan><tspan> side</tspan><tspan> to</tspan><tspan> move:</tspan><tspan class="b"> 8</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="624">6.</text>
<text class="cap" x="50" y="624" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> 8</tspan><tspan>,</tspan><tspan> which</tspan><tspan> is</tspan><tspan class="b"> -8</tspan><tspan> from</tspan><tspan> here.</tspan><tspan> No</tspan><tspan> better</tspan><tspan> for</tspan><tspan> your</tspan><tspan> opponent:</tspan><tspan class="b"> B</tspan><tspan> stays</tspan><tspan class="b"> ≥</tspan></text>
<text class="cap" x="50" y="642" xml:space="preserve"><tspan class="b">-4</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="668">7.</text>
<text class="cap" x="50" y="668" xml:space="preserve"><tspan class="b">B</tspan><tspan> is</tspan><tspan> finished</tspan><tspan> at</tspan><tspan class="b"> -4</tspan><tspan>,</tspan><tspan> and</tspan><tspan> that</tspan><tspan> goes</tspan><tspan> back</tspan><tspan> up</tspan><tspan> to</tspan><tspan class="b"> A</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="694">8.</text>
<text class="cap" x="50" y="694" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> -4</tspan><tspan>,</tspan><tspan> which</tspan><tspan> is</tspan><tspan class="b"> 4</tspan><tspan> from</tspan><tspan> here.</tspan><tspan class="b"> A</tspan><tspan> takes</tspan><tspan> your</tspan><tspan> side,</tspan><tspan> so</tspan><tspan> from</tspan><tspan> here</tspan><tspan> its</tspan></text>
<text class="cap" x="50" y="712" xml:space="preserve"><tspan>score</tspan><tspan> can</tspan><tspan> only</tspan><tspan> climb:</tspan><tspan class="b"> ≥</tspan><tspan class="b"> 4</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="738">9.</text>
<text class="cap" x="50" y="738" xml:space="preserve"><tspan>Walk</tspan><tspan> down</tspan><tspan> into</tspan><tspan class="b"> C</tspan><tspan>.</tspan><tspan> It</tspan><tspan> is</tspan><tspan> your</tspan><tspan> opponent's</tspan><tspan> move,</tspan><tspan> and</tspan><tspan> the</tspan><tspan> score</tspan><tspan> belongs</tspan><tspan> to</tspan></text>
<text class="cap" x="50" y="756" xml:space="preserve"><tspan>whoever</tspan><tspan> moves,</tspan><tspan> so</tspan><tspan class="b"> C</tspan><tspan> takes</tspan><tspan> the</tspan><tspan> biggest</tspan><tspan> child</tspan><tspan> like</tspan><tspan> every</tspan><tspan> other</tspan><tspan> node.</tspan><tspan> Nothing</tspan></text>
<text class="cap" x="50" y="774" xml:space="preserve"><tspan>seen</tspan><tspan> yet.</tspan></text>
<text class="num" x="24" y="800">10.</text>
<text class="cap" x="50" y="800" xml:space="preserve"><tspan>Bottom</tspan><tspan> of</tspan><tspan> the</tspan><tspan> tree.</tspan><tspan> Evaluate</tspan><tspan> the</tspan><tspan> position</tspan><tspan> for</tspan><tspan> the</tspan><tspan> side</tspan><tspan> to</tspan><tspan> move:</tspan><tspan class="b"> 3</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="826">11.</text>
<text class="cap" x="50" y="826" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> 3</tspan><tspan>,</tspan><tspan> which</tspan><tspan> is</tspan><tspan class="b"> -3</tspan><tspan> from</tspan><tspan> here.</tspan><tspan class="b"> C</tspan><tspan> takes</tspan><tspan> your</tspan><tspan> opponent's</tspan><tspan> side,</tspan><tspan> so</tspan><tspan> from</tspan></text>
<text class="cap" x="50" y="844" xml:space="preserve"><tspan>here</tspan><tspan> its</tspan><tspan> score</tspan><tspan> can</tspan><tspan> only</tspan><tspan> climb:</tspan><tspan class="b"> ≥</tspan><tspan class="b"> -3</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="870">12.</text>
<text class="cap cut" x="50" y="870" xml:space="preserve"><tspan>α</tspan><tspan> ≥</tspan><tspan> β</tspan><tspan> (</tspan><tspan class="b">-3</tspan><tspan> ≥</tspan><tspan class="b"> -4</tspan><tspan>):</tspan><tspan> whatever</tspan><tspan> is</tspan><tspan> left</tspan><tspan> down</tspan><tspan> here,</tspan><tspan> your</tspan><tspan> opponent</tspan><tspan> would</tspan><tspan> never</tspan><tspan> be</tspan></text>
<text class="cap cut" x="50" y="888" xml:space="preserve"><tspan>allowed</tspan><tspan> to</tspan><tspan> reach</tspan><tspan> it.</tspan><tspan class="b"> Cut</tspan><tspan class="b"> off</tspan><tspan>:</tspan><tspan> skip</tspan><tspan> the</tspan><tspan> rest</tspan><tspan> of</tspan><tspan class="b"> C</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="914">13.</text>
<text class="cap" x="50" y="914" xml:space="preserve"><tspan class="b">C</tspan><tspan> is</tspan><tspan> finished</tspan><tspan> at</tspan><tspan class="b"> ≥</tspan><tspan class="b"> -3</tspan><tspan>:</tspan><tspan> we</tspan><tspan> never</tspan><tspan> learned</tspan><tspan> its</tspan><tspan> exact</tspan><tspan> score,</tspan><tspan> only</tspan><tspan> that</tspan><tspan> it</tspan><tspan> is</tspan><tspan> at</tspan></text>
<text class="cap" x="50" y="932" xml:space="preserve"><tspan>least</tspan><tspan class="b"> -3</tspan><tspan>,</tspan><tspan> and</tspan><tspan> that</tspan><tspan> goes</tspan><tspan> back</tspan><tspan> up</tspan><tspan> to</tspan><tspan class="b"> A</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="958">14.</text>
<text class="cap" x="50" y="958" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> -3</tspan><tspan>,</tspan><tspan> which</tspan><tspan> is</tspan><tspan class="b"> 3</tspan><tspan> from</tspan><tspan> here.</tspan><tspan> No</tspan><tspan> better</tspan><tspan> for</tspan><tspan> you:</tspan><tspan class="b"> A</tspan><tspan> stays</tspan><tspan class="b"> ≥</tspan><tspan class="b"> 4</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="984">15.</text>
<text class="cap" x="50" y="984" xml:space="preserve"><tspan class="b">A</tspan><tspan> is</tspan><tspan> finished</tspan><tspan> at</tspan><tspan class="b"> 4</tspan><tspan>.</tspan><tspan> That</tspan><tspan> is</tspan><tspan> the</tspan><tspan> move</tspan><tspan> to</tspan><tspan> play.</tspan></text>
<text class="num" x="24" y="1010">16.</text>
<text class="cap" x="50" y="1010" xml:space="preserve"><tspan>Done:</tspan><tspan class="b"> A</tspan><tspan> =</tspan><tspan class="b"> 4</tspan><tspan>,</tspan><tspan> the</tspan><tspan> same</tspan><tspan> answer,</tspan><tspan> after</tspan><tspan> evaluating</tspan><tspan class="b"> 3</tspan><tspan> leaves</tspan><tspan> instead</tspan><tspan> of</tspan><tspan> 4.</tspan><tspan> The</tspan><tspan class="b"> 1</tspan></text>
<text class="cap" x="50" y="1028" xml:space="preserve"><tspan>skipped</tspan><tspan> leaf</tspan><tspan> could</tspan><tspan> not</tspan><tspan> have</tspan><tspan> changed</tspan><tspan> it.</tspan></text>
