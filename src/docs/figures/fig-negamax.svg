<text class="cap" x="50" y="716" xml:space="preserve"><tspan>whoever</tspan><tspan> moves,</tspan><tspan> so</tspan><tspan class="b"> C</tspan><tspan> takes</tspan><tspan> the</tspan><tspan> biggest</tspan><tspan> child</tspan><tspan> like</tspan><tspan> every</tspan><tspan> other</tspan><tspan> node.</tspan><tspan> Nothing</tspan></text>
<text class="cap" x="50" y="734" xml:space="preserve"><tspan>seen</tspan><tspan> yet.</tspan></text>
