<text class="head" x="24" y="358">STEP BY STEP</text>
<text class="num" x="24" y="382">1.</text>
<text class="cap" x="50" y="382" xml:space="preserve"><tspan>Start</tspan><tspan> at</tspan><tspan class="b"> A</tspan><tspan>.</tspan><tspan> It</tspan><tspan> is</tspan><tspan> your</tspan><tspan> move,</tspan><tspan> and</tspan><tspan> the</tspan><tspan> score</tspan><tspan> belongs</tspan><tspan> to</tspan><tspan> whoever</tspan><tspan> moves,</tspan><tspan> so</tspan><tspan class="b"> A</tspan></text>
<text class="cap" x="50" y="400" xml:space="preserve"><tspan>takes</tspan><tspan> the</tspan><tspan> biggest</tspan><tspan> child</tspan><tspan> like</tspan><tspan> every</tspan><tspan> other</tspan><tspan> node.</tspan><tspan> Nothing</tspan><tspan> seen</tspan><tspan> yet.</tspan></text>
<text class="num" x="24" y="426">2.</text>
<text class="cap" x="50" y="426" xml:space="preserve"><tspan>Walk</tspan><tspan> down</tspan><tspan> into</tspan><tspan class="b"> B</tspan><tspan>.</tspan><tspan> It</tspan><tspan> is</tspan><tspan> your</tspan><tspan> opponent's</tspan><tspan> move,</tspan><tspan> and</tspan><tspan> the</tspan><tspan> score</tspan><tspan> belongs</tspan><tspan> to</tspan></text>
<text class="cap" x="50" y="444" xml:space="preserve"><tspan>whoever</tspan><tspan> moves,</tspan><tspan> so</tspan><tspan class="b"> B</tspan><tspan> takes</tspan><tspan> the</tspan><tspan> biggest</tspan><tspan> child</tspan><tspan> like</tspan><tspan> every</tspan><tspan> other</tspan><tspan> node.</tspan><tspan> Nothing</tspan></text>
<text class="cap" x="50" y="462" xml:space="preserve"><tspan>seen</tspan><tspan> yet.</tspan></text>
<text class="num" x="24" y="488">3.</text>
<text class="cap" x="50" y="488" xml:space="preserve"><tspan>Bottom</tspan><tspan> of</tspan><tspan> the</tspan><tspan> tree.</tspan><tspan> Evaluate</tspan><tspan> the</tspan><tspan> position</tspan><tspan> for</tspan><tspan> the</tspan><tspan> side</tspan><tspan> to</tspan><tspan> move:</tspan><tspan class="b"> 4</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="514">4.</text>
<text class="cap" x="50" y="514" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> 4</tspan><tspan>,</tspan><tspan> which</tspan><tspan> is</tspan><tspan class="b"> -4</tspan><tspan> from</tspan><tspan> here.</tspan><tspan class="b"> B</tspan><tspan> takes</tspan><tspan> your</tspan><tspan> opponent's</tspan><tspan> side,</tspan><tspan> so</tspan><tspan> from</tspan></text>
<text class="cap" x="50" y="532" xml:space="preserve"><tspan>here</tspan><tspan> its</tspan><tspan> score</tspan><tspan> can</tspan><tspan> only</tspan><tspan> climb:</tspan><tspan class="b"> ≥</tspan><tspan class="b"> -4</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="558">5.</text>
<text class="cap" x="50" y="558" xml:space="preserve"><tspan>Bottom</tspan><tspan> of</tspan><tspan> the</tspan><tspan> tree.</tspan><tspan> Evaluate</tspan><tspan> the</tspan><tspan> position</tspan><tspan> for</tspan><tspan> the</tspan><tspan> side</tspan><tspan> to</tspan><tspan> move:</tspan><tspan class="b"> 8</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="584">6.</text>
<text class="cap" x="50" y="584" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> 8</tspan><tspan>,</tspan><tspan> which</tspan><tspan> is</tspan><tspan class="b"> -8</tspan><tspan> from</tspan><tspan> here.</tspan><tspan> No</tspan><tspan> better</tspan><tspan> for</tspan><tspan> your</tspan><tspan> opponent:</tspan><tspan class="b"> B</tspan><tspan> stays</tspan><tspan class="b"> ≥</tspan></text>
<text class="cap" x="50" y="602" xml:space="preserve"><tspan class="b">-4</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="628">7.</text>
<text class="cap" x="50" y="628" xml:space="preserve"><tspan class="b">B</tspan><tspan> is</tspan><tspan> finished</tspan><tspan> at</tspan><tspan class="b"> -4</tspan><tspan>,</tspan><tspan> and</tspan><tspan> that</tspan><tspan> goes</tspan><tspan> back</tspan><tspan> up</tspan><tspan> to</tspan><tspan class="b"> A</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="654">8.</text>
<text class="cap" x="50" y="654" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> -4</tspan><tspan>,</tspan><tspan> which</tspan><tspan> is</tspan><tspan class="b"> 4</tspan><tspan> from</tspan><tspan> here.</tspan><tspan class="b"> A</tspan><tspan> takes</tspan><tspan> your</tspan><tspan> side,</tspan><tspan> so</tspan><tspan> from</tspan><tspan> here</tspan><tspan> its</tspan></text>
<text class="cap" x="50" y="672" xml:space="preserve"><tspan>score</tspan><tspan> can</tspan><tspan> only</tspan><tspan> climb:</tspan><tspan class="b"> ≥</tspan><tspan class="b"> 4</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="698">9.</text>
