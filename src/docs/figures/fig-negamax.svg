<text class="cap" x="50" y="760" xml:space="preserve"><tspan>Bottom</tspan><tspan> of</tspan><tspan> the</tspan><tspan> tree.</tspan><tspan> Evaluate</tspan><tspan> the</tspan><tspan> position</tspan><tspan> for</tspan><tspan> the</tspan><tspan> side</tspan><tspan> to</tspan><tspan> move:</tspan><tspan class="b"> 3</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="786">11.</text>
<text class="cap" x="50" y="786" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> 3</tspan><tspan>,</tspan><tspan> which</tspan><tspan> is</tspan><tspan class="b"> -3</tspan><tspan> from</tspan><tspan> here.</tspan><tspan class="b"> C</tspan><tspan> takes</tspan><tspan> your</tspan><tspan> opponent's</tspan><tspan> side,</tspan><tspan> so</tspan><tspan> from</tspan></text>
<text class="cap" x="50" y="804" xml:space="preserve"><tspan>here</tspan><tspan> its</tspan><tspan> score</tspan><tspan> can</tspan><tspan> only</tspan><tspan> climb:</tspan><tspan class="b"> ≥</tspan><tspan class="b"> -3</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="830">12.</text>
<text class="cap" x="50" y="830" xml:space="preserve"><tspan>Bottom</tspan><tspan> of</tspan><tspan> the</tspan><tspan> tree.</tspan><tspan> Evaluate</tspan><tspan> the</tspan><tspan> position</tspan><tspan> for</tspan><tspan> the</tspan><tspan> side</tspan><tspan> to</tspan><tspan> move:</tspan><tspan class="b"> 2</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="856">13.</text>
<text class="cap" x="50" y="856" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> 2</tspan><tspan>,</tspan><tspan> which</tspan><tspan> is</tspan><tspan class="b"> -2</tspan><tspan> from</tspan><tspan> here.</tspan><tspan> Better</tspan><tspan> for</tspan><tspan> your</tspan><tspan> opponent:</tspan><tspan class="b"> C</tspan><tspan> is</tspan><tspan> now</tspan><tspan class="b"> ≥</tspan></text>
<text class="cap" x="50" y="874" xml:space="preserve"><tspan class="b">-2</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="900">14.</text>
<text class="cap" x="50" y="900" xml:space="preserve"><tspan class="b">C</tspan><tspan> is</tspan><tspan> finished</tspan><tspan> at</tspan><tspan class="b"> -2</tspan><tspan>,</tspan><tspan> and</tspan><tspan> that</tspan><tspan> goes</tspan><tspan> back</tspan><tspan> up</tspan><tspan> to</tspan><tspan class="b"> A</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="926">15.</text>
<text class="cap" x="50" y="926" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> -2</tspan><tspan>,</tspan><tspan> which</tspan><tspan> is</tspan><tspan class="b"> 2</tspan><tspan> from</tspan><tspan> here.</tspan><tspan> No</tspan><tspan> better</tspan><tspan> for</tspan><tspan> you:</tspan><tspan class="b"> A</tspan><tspan> stays</tspan><tspan class="b"> ≥</tspan><tspan class="b"> 4</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="952">16.</text>
<text class="cap" x="50" y="952" xml:space="preserve"><tspan class="b">A</tspan><tspan> is</tspan><tspan> finished</tspan><tspan> at</tspan><tspan class="b"> 4</tspan><tspan>.</tspan><tspan> That</tspan><tspan> is</tspan><tspan> the</tspan><tspan> move</tspan><tspan> to</tspan><tspan> play.</tspan></text>
<text class="num" x="24" y="978">17.</text>
<text class="cap" x="50" y="978" xml:space="preserve"><tspan>Done:</tspan><tspan class="b"> A</tspan><tspan> =</tspan><tspan class="b"> 4</tspan><tspan>,</tspan><tspan> after</tspan><tspan> evaluating</tspan><tspan> all</tspan><tspan class="b"> 4</tspan><tspan> leaves.</tspan></text>
