<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 556" width="560" height="556" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
  .bg    { fill: #ffffff; }
  .panel { fill: #f6f7f9; }
  .done  { fill: #ebedf0; }
  .line  { stroke: #c8cdd4; }
  .edge  { stroke: #1c1e21; stroke-width: 2; opacity: .5; fill: none; }
  .edge.pruned { stroke: #c8cdd4; stroke-width: 1.6; stroke-dasharray: 3 4; opacity: .7; }
  .box   { stroke-width: 1.8; }
  .max   { stroke: #c62828; }
  .min   { stroke: #1d4ed8; }
  .nega  { stroke: #a16207; }
  .leafbox { stroke: #c8cdd4; }
  .leafbox.pruned { stroke-dasharray: 3 4; opacity: .5; }
  .name  { font-size: 11px; }
  .name.max { fill: #c62828; }
  .name.min { fill: #1d4ed8; }
  .name.nega { fill: #a16207; }
  .val   { fill: #1c1e21; font-size: 15px; font-weight: 650; }
  .val.dim { fill: #9aa1ab; }
  .ab    { fill: #6b7280; font-size: 11px; }
  .title { fill: #1c1e21; font-size: 15px; font-weight: 650; }
  .head  { fill: #6b7280; font-size: 11px; letter-spacing: .08em; }
  .cap   { fill: #1c1e21; font-size: 13px; }
  .num   { fill: #6b7280; font-size: 12px; }
  .cut   { fill: #7c3aed; }
  .cut .b, .cut tspan { fill: #7c3aed; }
  .b     { font-weight: 650; }
  text   { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .mid   { text-anchor: middle; }

  @media (prefers-color-scheme: dark) {
    .bg    { fill: #14161a; }
    .panel { fill: #1b1e24; }
    .done  { fill: #24272e; }
    .line  { stroke: #333944; }
    .edge  { stroke: #e7e9ee; }
    .edge.pruned { stroke: #333944; }
    .max, .name.max { stroke: #f4796b; }
    .name.max { fill: #f4796b; }
    .min, .name.min { stroke: #7aa7f5; }
    .name.min { fill: #7aa7f5; }
    .nega, .name.nega { stroke: #fbbf24; }
    .name.nega { fill: #fbbf24; }
    .leafbox { stroke: #333944; }
    .val, .title { fill: #e7e9ee; }
    .val.dim { fill: #5c646f; }
    .ab, .head, .num { fill: #98a1af; }
    .cap   { fill: #e7e9ee; }
    .cut, .cut tspan { fill: #a78bfa; }
  }
</style>
<rect class="bg" x="0" y="0" width="560" height="556" rx="10"/>
<rect class="bg line" x="0.5" y="0.5" width="559" height="555" rx="10" fill="none"/>
<text class="title" x="24" y="24">Depth 1 — you are choosing</text>
<path class="edge" d="M 280 114 L 144 175"/>
<path class="edge" d="M 280 114 L 280 175"/>
<path class="edge" d="M 280 114 L 416 175"/>
<rect class="box done max" x="222" y="58" width="116" height="56" rx="9"/>
<text class="name mid max" x="280" y="73" dominant-baseline="middle">A ▲ max</text>
<text class="val mid" x="280" y="96" dominant-baseline="middle">score = 3</text>
<rect class="box done leafbox" x="99" y="175" width="90" height="46" rx="7"/>
<text class="val mid" x="144" y="198" dominant-baseline="middle">eval = 1</text>
<rect class="box done leafbox" x="235" y="175" width="90" height="46" rx="7"/>
<text class="val mid" x="280" y="198" dominant-baseline="middle">eval = 3</text>
<rect class="box done leafbox" x="371" y="175" width="90" height="46" rx="7"/>
<text class="val mid" x="416" y="198" dominant-baseline="middle">eval = 2</text>
<line class="line" x1="24" y1="228" x2="536" y2="228"/>
<text class="head" x="24" y="246">STEP BY STEP</text>
<text class="num" x="24" y="270">1.</text>
<text class="cap" x="50" y="270" xml:space="preserve"><tspan>Start</tspan><tspan> at</tspan><tspan class="b"> A</tspan><tspan>.</tspan><tspan> It</tspan><tspan> is</tspan><tspan> your</tspan><tspan> move,</tspan><tspan> so</tspan><tspan> the</tspan><tspan> biggest</tspan><tspan> child</tspan><tspan> wins.</tspan><tspan> Nothing</tspan><tspan> seen</tspan></text>
<text class="cap" x="50" y="288" xml:space="preserve"><tspan>yet,</tspan><tspan> so</tspan><tspan> the</tspan><tspan> score</tspan><tspan> could</tspan><tspan> still</tspan><tspan> be</tspan><tspan> anything.</tspan></text>
<text class="num" x="24" y="314">2.</text>
<text class="cap" x="50" y="314" xml:space="preserve"><tspan>Bottom</tspan><tspan> of</tspan><tspan> the</tspan><tspan> tree.</tspan><tspan> Evaluate</tspan><tspan> the</tspan><tspan> position:</tspan><tspan class="b"> 1</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="340">3.</text>
<text class="cap" x="50" y="340" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> 1</tspan><tspan>.</tspan><tspan class="b"> A</tspan><tspan> takes</tspan><tspan> your</tspan><tspan> side,</tspan><tspan> so</tspan><tspan> from</tspan><tspan> here</tspan><tspan> its</tspan><tspan> score</tspan><tspan> can</tspan><tspan> only</tspan></text>
<text class="cap" x="50" y="358" xml:space="preserve"><tspan>climb:</tspan><tspan class="b"> ≥</tspan><tspan class="b"> 1</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="384">4.</text>
<text class="cap" x="50" y="384" xml:space="preserve"><tspan>Bottom</tspan><tspan> of</tspan><tspan> the</tspan><tspan> tree.</tspan><tspan> Evaluate</tspan><tspan> the</tspan><tspan> position:</tspan><tspan class="b"> 3</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="410">5.</text>
<text class="cap" x="50" y="410" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> 3</tspan><tspan>.</tspan><tspan> Better</tspan><tspan> for</tspan><tspan> you:</tspan><tspan class="b"> A</tspan><tspan> is</tspan><tspan> now</tspan><tspan class="b"> ≥</tspan><tspan class="b"> 3</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="436">6.</text>
<text class="cap" x="50" y="436" xml:space="preserve"><tspan>Bottom</tspan><tspan> of</tspan><tspan> the</tspan><tspan> tree.</tspan><tspan> Evaluate</tspan><tspan> the</tspan><tspan> position:</tspan><tspan class="b"> 2</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="462">7.</text>
<text class="cap" x="50" y="462" xml:space="preserve"><tspan>Back</tspan><tspan> up</tspan><tspan> with</tspan><tspan class="b"> 2</tspan><tspan>.</tspan><tspan> No</tspan><tspan> better</tspan><tspan> for</tspan><tspan> you:</tspan><tspan class="b"> A</tspan><tspan> stays</tspan><tspan class="b"> ≥</tspan><tspan class="b"> 3</tspan><tspan>.</tspan></text>
<text class="num" x="24" y="488">8.</text>
<text class="cap" x="50" y="488" xml:space="preserve"><tspan class="b">A</tspan><tspan> is</tspan><tspan> finished</tspan><tspan> at</tspan><tspan class="b"> 3</tspan><tspan>.</tspan><tspan> That</tspan><tspan> is</tspan><tspan> the</tspan><tspan> move</tspan><tspan> to</tspan><tspan> play.</tspan></text>
<text class="num" x="24" y="514">9.</text>
<text class="cap" x="50" y="514" xml:space="preserve"><tspan>Done:</tspan><tspan class="b"> A</tspan><tspan> =</tspan><tspan class="b"> 3</tspan><tspan>,</tspan><tspan> after</tspan><tspan> evaluating</tspan><tspan> all</tspan><tspan class="b"> 3</tspan><tspan> leaves.</tspan></text>
</svg>
