# Needs pre-commit from `uv tool install pre-commit`; a `uvx` install points the
# hook into the GC-able uv cache. Both hooks check the whole project.

repos:
- repo: local
  hooks:
    - id: eslint
      name: eslint
      entry: pnpm lint
      language: system
      types_or: [ts, tsx, javascript, jsx]
      pass_filenames: false

    - id: tsc
      name: tsc (typecheck)
      # Catches API-shape changes in the generated types; eslint won't.
      entry: pnpm exec tsc -b
      language: system
      types_or: [ts, tsx, javascript, jsx, json]
      pass_filenames: false
